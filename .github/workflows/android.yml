name: Android verification
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Export baseline schema when missing
        run: |
          if [ ! -f core/data/schemas/com.novelverse.core.data.NovelDatabase/1.json ]; then
            git fetch --depth=1 origin e6077716844ad583cc55edf807b9441f02833ebe
            git worktree add "$RUNNER_TEMP/novelverse-schema-v1" e6077716844ad583cc55edf807b9441f02833ebe
            ./gradlew -p "$RUNNER_TEMP/novelverse-schema-v1" :core:data:kspDebugKotlin
            mkdir -p core/data/schemas/com.novelverse.core.data.NovelDatabase
            cp "$RUNNER_TEMP/novelverse-schema-v1/core/data/schemas/com.novelverse.core.data.NovelDatabase/1.json" core/data/schemas/com.novelverse.core.data.NovelDatabase/1.json
          fi
      - name: Unit tests, lint and APK
        run: ./gradlew :core:domain:test :core:data:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :core:data:assembleDebugAndroidTest
      - name: Check exported schemas
        run: git diff --exit-code -- core/data/schemas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            core/domain/build/reports/tests/
            core/data/schemas/
            core/data/build/reports/tests/
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Persistence and UI journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :core:data:connectedDebugAndroidTest :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-reports
          path: |
            app/build/reports/androidTests/
            core/data/build/reports/androidTests/
